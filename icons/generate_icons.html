<!DOCTYPE html>
<html>
<head>
  <title>Generate WzzWord Icons</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 40px; background: #1e293b; color: white; }
    h1 { margin-bottom: 10px; }
    p { color: #94a3b8; margin-bottom: 30px; }
    .source-preview { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
    .source-preview img { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; border: 1px solid #334155; background: #0f172a; }
    .source-preview .source-meta { display: flex; flex-direction: column; gap: 8px; }
    .error { color: #fecaca; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); padding: 12px 14px; border-radius: 10px; display: none; }
    .warn { color: #fde68a; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); padding: 12px 14px; border-radius: 10px; display: none; }
    .icon-grid { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 30px; }
    .icon-item { text-align: center; }
    .icon-item p { margin-top: 10px; font-size: 14px; }
    canvas { background: transparent; border: 1px solid #334155; border-radius: 8px; }
    button { 
      padding: 12px 24px; 
      cursor: pointer; 
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
    }
    button:hover { opacity: 0.9; }
    .btn-secondary {
      background: #334155;
      border: 1px solid #475569;
    }
    .instructions {
      margin-top: 40px;
      padding: 20px;
      background: #334155;
      border-radius: 8px;
    }
    .instructions h3 { margin-bottom: 10px; }
    .instructions ol { margin-left: 20px; }
    .instructions li { margin-bottom: 8px; color: #94a3b8; }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🎨 WzzWord Icon Generator</h1>
  <p>使用本目录下的 <code>iocn.jpg</code> 生成 Chrome 扩展所需的各尺寸图标</p>

  <div class="source-preview">
    <img id="sourcePreview" src="iocn.jpg" alt="Source Image">
    <div class="source-meta">
      <div>源图：<code>icons/iocn.jpg</code></div>
      <div class="warn" id="fileProtocolWarn"></div>
      <div class="error" id="loadError"></div>
      <div>
        <button class="btn-secondary" id="pickFileBtn" type="button">选择图片（推荐）</button>
        <input id="fileInput" type="file" accept="image/*" style="display:none" />
      </div>
    </div>
  </div>
  
  <div class="icon-grid" id="iconGrid"></div>
  
  <button onclick="downloadAll()">📥 下载所有图标</button>

  <div class="instructions">
    <h3>使用说明</h3>
    <ol>
      <li>点击上方按钮下载所有尺寸的图标</li>
      <li>将下载的 PNG 文件放入 <code>icons/</code> 目录</li>
      <li>确保文件名为: <code>icon16.png</code>, <code>icon32.png</code>, <code>icon48.png</code>, <code>icon128.png</code></li>
    </ol>
  </div>

  <script>
    const sizes = [16, 32, 48, 128];
    const iconGrid = document.getElementById('iconGrid');
    const sourcePath = 'iocn.jpg';
    const sourcePreview = document.getElementById('sourcePreview');
    const loadError = document.getElementById('loadError');
    const fileProtocolWarn = document.getElementById('fileProtocolWarn');
    const pickFileBtn = document.getElementById('pickFileBtn');
    const fileInput = document.getElementById('fileInput');
    const sourceImg = new Image();
    sourceImg.src = sourcePath;

    if (location.protocol === 'file:') {
      fileProtocolWarn.textContent = '你正在通过 file:// 打开页面，浏览器可能会阻止 Canvas 导出。建议点击“选择图片（推荐）”重新选择同一张图片后再下载，或用本地服务器方式打开该页面。';
      fileProtocolWarn.style.display = 'block';
    }
    
    function drawImageCover(ctx, img, size) {
      ctx.clearRect(0, 0, size, size);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      const imgW = img.naturalWidth || img.width;
      const imgH = img.naturalHeight || img.height;
      if (!imgW || !imgH) return;

      const scale = Math.max(size / imgW, size / imgH);
      const drawW = imgW * scale;
      const drawH = imgH * scale;
      const dx = (size - drawW) / 2;
      const dy = (size - drawH) / 2;
      ctx.drawImage(img, dx, dy, drawW, drawH);
    }

    function renderAll() {
      iconGrid.innerHTML = '';

      sizes.forEach(size => {
        const item = document.createElement('div');
        item.className = 'icon-item';

        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        canvas.id = 'icon' + size;

        const ctx = canvas.getContext('2d');
        drawImageCover(ctx, sourceImg, size);

        const label = document.createElement('p');
        label.textContent = size + ' × ' + size;

        item.appendChild(canvas);
        item.appendChild(label);
        iconGrid.appendChild(item);
      });
    }
    
    sourceImg.onload = () => {
      loadError.style.display = 'none';
      renderAll();
    };

    sourceImg.onerror = () => {
      loadError.textContent = `图片加载失败：${sourcePath}。请确认该文件存在于本 HTML 同目录（icons/）下。`;
      loadError.style.display = 'block';
      if (sourcePreview) sourcePreview.style.display = 'none';
    };

    pickFileBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        sourceImg.src = dataUrl;
        if (sourcePreview) sourcePreview.src = dataUrl;
      };
      reader.onerror = () => {
        loadError.textContent = '读取图片失败，请重试或更换图片文件。';
        loadError.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });
    
    function downloadAll() {
      if (!sourceImg.complete || !sourceImg.naturalWidth) {
        return;
      }
      sizes.forEach((size, index) => {
        setTimeout(() => {
          const canvas = document.getElementById('icon' + size);
          const link = document.createElement('a');
          link.download = 'icon' + size + '.png';
          try {
            link.href = canvas.toDataURL('image/png');
            link.click();
          } catch (e) {
            alert('下载失败：浏览器阻止了 Canvas 导出（Tainted canvas）。\n\n解决方案：\n1) 点击“选择图片（推荐）”，重新选择 icons/iocn.jpg（或任意图片）后再下载；\n2) 或者使用本地服务器方式打开该 HTML（不要用 file:// 直接打开）。');
          }
        }, index * 200);
      });
    }
  </script>
</body>
</html>
